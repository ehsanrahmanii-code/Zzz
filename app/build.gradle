plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'ai.titan.android'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.titan.android'
        minSdk 24
        targetSdk 35
        versionCode 45
        versionName '45.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false; shrinkResources false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install("numpy")
            install("pandas")
            install("requests")
            install("Flask")
            install("websocket-client")
        }
    }
}
dependencies {}
