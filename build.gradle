plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'ai.titan.android'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.titan.android'
        minSdk 24
        targetSdk 35
        versionCode 44
        versionName '44.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython("python3.13")
        pip {
            install("numpy")
            install("pandas")
            install("requests")
            install("Flask")
            install("websocket-client")
        }
    }
}

dependencies {
}
