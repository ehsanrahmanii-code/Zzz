name: TITAN AI V45 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble V45 source
        run: |
          mkdir -p app/src/main/python
          : > app/src/main/python/titan_v45.py
          for f in v45_final/part*.py; do cat "$f" >> app/src/main/python/titan_v45.py; printf '\n' >> app/src/main/python/titan_v45.py; done
          python3 -m py_compile app/src/main/python/titan_v45.py
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TITAN_AI_V45_APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
