name: TITAN AI V45 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble V45 Python source
        shell: bash
        run: |
          mkdir -p app/src/main/python
          cat v45_parts/part*.py > app/src/main/python/titan_v45.py
          python3 -m py_compile app/src/main/python/titan_v45.py

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN_AI_V45_APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
